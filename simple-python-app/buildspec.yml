
version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11

  pre_build:
    commands:
      - echo "Installing Python dependencies..."
      - pip install -r simple-python-app/requirements.txt

  build:
    commands:
      - echo "Checking Python syntax..."
      - (cd simple-python-app && python -m py_compile app.py)
      - echo "Testing Flask application..."
      - (cd simple-python-app && python -c "from app import app; client = app.test_client(); response = client.get('/'); assert response.status_code == 200; assert response.data == b'Hello, world!'; print('Flask application test passed!')")

  post_build:
    commands:
      - echo "Build completed successfully!"

artifacts:
  files:
    - app.py
    - requirements.txt
  base-directory: simple-python-app

